<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mordomia Zarpo — Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Login Screen -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">Mordomia <span style="color:var(--primary)">●</span> Zarpo</div>
    <div class="login-sub">Painel Administrativo</div>
    <div id="login-alert" class="alert" style="display:none"></div>
    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="login-user">Usuário</label>
        <input class="form-control" type="text" id="login-user" placeholder="admin" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="login-pass">Senha</label>
        <input class="form-control" type="password" id="login-pass" placeholder="••••••" autocomplete="current-password">
      </div>
      <button type="submit" id="login-btn" class="btn-sm btn-primary btn-full" style="margin-top:8px">Entrar</button>
    </form>
    <div style="margin-top:20px;text-align:center">
      <a href="index.html" style="color:var(--light);font-size:13px;text-decoration:none">← Voltar ao calendário</a>
    </div>
  </div>
</div>

<!-- Admin Panel -->
<div id="admin-panel" style="display:none;flex-direction:column;min-height:100vh">

  <nav class="navbar">
    <a href="index.html" class="navbar-brand">Mordomia <span class="logo-dot">●</span> Zarpo</a>
    <div class="navbar-nav">
      <a href="index.html">Calendário</a>
      <a href="request.html">Solicitar Ausência</a>
    </div>
    <div class="navbar-right">
      <span style="font-size:13px;color:var(--medium)">👤 <span id="admin-user-name"></span></span>
      <button class="btn-sm btn-ghost" onclick="logout()">Sair</button>
    </div>
  </nav>

  <div class="admin-layout" style="flex:1">

    <aside class="sidebar">
      <button class="sidebar-item active" data-tab="funcionarios" onclick="loadTab('funcionarios')">
        <span class="sidebar-icon">👥</span> Funcionários
      </button>
      <button class="sidebar-item" data-tab="eventos" onclick="loadTab('eventos')">
        <span class="sidebar-icon">📅</span> Eventos
      </button>
      <button class="sidebar-item" data-tab="escala" onclick="loadTab('escala')">
        <span class="sidebar-icon">📋</span> Escala FDS
      </button>
      <button class="sidebar-item" data-tab="feriados" onclick="loadTab('feriados')">
        <span class="sidebar-icon">🗓️</span> Feriados
      </button>
      <button class="sidebar-item" data-tab="pedidos" onclick="loadTab('pedidos')">
        <span class="sidebar-icon">📨</span> Pedidos
      </button>
    </aside>

    <main class="admin-content" id="admin-content">
      <div class="loader"><div class="spinner"></div></div>
    </main>

  </div>
</div>

<script src="js/config.js?v=6"></script>
<script src="js/api.js?v=6"></script>
<script src="js/datepicker.js?v=6"></script>
<script src="js/admin.js?v=6"></script>
</body>
</html>
